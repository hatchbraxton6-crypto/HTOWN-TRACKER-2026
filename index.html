    const fmt$ = (n) => "$" + Math.round(n).toLocaleString();
    const repRev = (r) => r.accounts * r.acv;

    function weekTotals(w) {
      const accounts = w.reps.reduce((a, r) => a + r.accounts, 0);
      const revenue = w.reps.reduce((a, r) => a + repRev(r), 0);
      return { accounts, revenue };
    }

    function groupByMonth(weeks) {
      const map = {};
      weeks.forEach(w => {
        const m = w.month || "Unknown";
        if (!map[m]) map[m] = [];
        map[m].push(w);
      });
      return map;
    }

      const map = {};
      weeks.forEach((w) =>
        w.reps.forEach((r) => {
          if (!map[r.name]) map[r.name] = { accounts: 0, revenue: 0, acvSum: 0, weeksActive: 0, bestWeek: 0, bestWeekLabel: "", weekHistory: [] };
          map[r.name].accounts += r.accounts;
          map[r.name].revenue += repRev(r);
          map[r.name].acvSum += r.acv;
          map[r.name].weeksActive += 1;
          if (r.accounts >= map[r.name].bestWeek) { map[r.name].bestWeek = r.accounts; map[r.name].bestWeekLabel = w.label; }
          map[r.name].weekHistory.push({ label: w.label, accounts: r.accounts, revenue: repRev(r) });
        })
      );
      return Object.entries(map)
        .map(([name, v]) => {
          const avg = v.accounts / v.weeksActive;
          const variance = v.weekHistory.reduce((s, wh) => s + Math.pow(wh.accounts - avg, 2), 0) / (v.weeksActive || 1);
          const stdDev = Math.sqrt(variance);
          const consistency = avg > 0 ? Math.max(0, Math.round(100 - (stdDev / avg) * 100)) : 0;
          return { name, ...v, avgAcv: v.acvSum / v.weeksActive, avgPerWeek: avg, consistency };
        })
        .sort((a, b) => b.accounts - a.accounts);
    }

    function repTrend(weeks, repName) {
      return weeks.map(w => {
        const r = w.reps.find(x => x.name === repName);
        return r ? r.accounts : null;
      });
    }

    // ── Slump detection ───────────────────────────────────────────────
    function getSlumpReps(weeks) {
      const names = [...new Set(weeks.flatMap(w => w.reps.map(r => r.name)))].filter(n => !n.includes("☠️"));
      return names.reduce((out, name) => {
        const history = weeks
          .map(w => { const r = w.reps.find(x => x.name === name); return r ? { label: w.label, accounts: r.accounts } : null; })
          .filter(Boolean);
        if (history.length >= 2) {
          const last = history[history.length - 1];
          const prev = history[history.length - 2];
          if (last.accounts <= 6 && prev.accounts <= 6) out.push({ name, prev, last });
        }
        return out;
      }, []);
    }

    // ── Sparkline ─────────────────────────────────────────────────────
    function Spark({ data }) {
      const valid = data.filter(d => d !== null);
      if (valid.length < 2) return <span style={{ color: "#555", fontSize: 11 }}>—</span>;
      const max = Math.max(...valid), min = Math.min(...valid);
      const range = max - min || 1;
      const W = 56, H = 22;
      const coords = data.map((v, i) => v !== null ? `${(i / (data.length - 1)) * W},${H - ((v - min) / range) * (H - 4) - 2}` : null).filter(Boolean).join(" ");
      const last = valid[valid.length - 1], prev = valid[valid.length - 2];
      const up = last > prev, down = last < prev;
      return (
        <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
          <svg width={W} height={H}>
            <polyline points={coords} fill="none" stroke={up ? "#3db557" : down ? "#e05252" : "#888"} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
          </svg>
          <span style={{ fontSize: 13, fontWeight: 800, color: up ? "#3db557" : down ? "#e05252" : "#888" }}>
            {up ? "▲" : down ? "▼" : "—"}
          </span>
        </span>
      );
    }

    // ── Goal Bar ──────────────────────────────────────────────────────

      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontSize: 10, letterSpacing: 2, color: "#666", fontWeight: 700 }}>{label}</span>
            <span style={{ fontSize: 12, fontWeight: 700, color }}>{current} / {goal} ({pct}%)</span>
          </div>
          <div style={{ background: "#1a1a1a", borderRadius: 6, height: 8, overflow: "hidden" }}>
            <div style={{ width: `${pct}%`, background: color, height: "100%", borderRadius: 6, transition: "width 0.4s" }} />
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────

      const filteredTotals = filteredWeeks.reduce((a, w) => { const t = weekTotals(w); return { accounts: a.accounts + t.accounts, revenue: a.revenue + t.revenue }; }, { accounts: 0, revenue: 0 });

                      <tr key={w.id} style={S.tr}>

          {/* ══ CAREER ══ */}
          {view === "career" && (

                      </tr>

                  </table>
                </div>

              {allSummary.map((rep, i) => (

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 14, letterSpacing: 2, color: i === 0 ? "#f5c842" : "#3db557" }}>
                      {i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : ""}<RepName name={rep.name} />
                    </div>
                    <div style={{ fontSize: 11, color: "#555" }}>{rep.weeksActive} weeks · {rep.accounts} total accts</div>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {rep.weekHistory.map((wh, j) => {
                      const mc = monthColor(wh.label);
                      return (
                        <div key={j} style={{ background: mc.bg, border: `1px solid ${mc.border}`, borderRadius: 8, padding: "6px 10px", minWidth: 70, textAlign: "center" }}>
                          <div style={{ fontSize: 9, color: mc.text, letterSpacing: 1, fontWeight: 700 }}>{wh.label}</div>
                          <div style={{ fontSize: 18, fontFamily: "'Bebas Neue',cursive", color: "#e0e0e0", lineHeight: 1.2 }}>{wh.accounts}</div>
                          <div style={{ fontSize: 10, color: "#555" }}>{fmt$(wh.revenue)}</div>

          {/* ══ TEAMS ══ */}
          {view === "teams" && (
            <div style={S.content}>
              <div style={S.cardRow}>
                {Object.entries(TEAMS).map(([key, team]) => {
                  const tw = weeks.map(w => ({ ...w, reps: w.reps.filter(r => team.members.includes(r.name)) }));
                  const totals = tw.reduce((a, w) => { const t = weekTotals(w); return { accounts: a.accounts + t.accounts, revenue: a.revenue + t.revenue }; }, { accounts: 0, revenue: 0 });
                  return (
                    <div key={key} style={{ ...S.card, background: team.bg, border: `1px solid ${team.border}`, flex: 1 }}>
                      <div style={{ ...S.cardLabel, color: team.color }}>{team.label}</div>
                      <div style={{ ...S.cardVal, color: team.color, fontSize: 34 }}>{totals.accounts}</div>
                      <div style={S.cardSub}>{team.members.length} reps · {fmt$(totals.revenue)}</div>
                    </div>
                  );
                })}
              </div>

              <div style={S.section}>
                <div style={S.sectionTitle}>Team Standings</div>
                <table style={S.table}>
                  <thead><tr>
                    <th style={S.th}>Team</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Reps</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Total Accts</th>
                    <th style={{ ...S.th, textAlign: "right" }}>Revenue</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Avg/Rep</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Avg/Wk</th>
                  </tr></thead>
                  <tbody>{Object.entries(TEAMS).map(([key, team]) => {
                    const tw = weeks.map(w => ({ ...w, reps: w.reps.filter(r => team.members.includes(r.name)) }));
                    const totals = tw.reduce((a, w) => { const t = weekTotals(w); return { accounts: a.accounts + t.accounts, revenue: a.revenue + t.revenue }; }, { accounts: 0, revenue: 0 });
                    return (
                      <tr key={key} style={S.tr}>
                        <td style={{ ...S.td, fontWeight: 700, color: team.color, whiteSpace: "nowrap" }}>{team.label}</td>
                        <td style={{ ...S.td, textAlign: "center", color: "#555" }}>{team.members.length}</td>
                        <td style={{ ...S.td, textAlign: "center", fontWeight: 800, fontSize: 18 }}>{totals.accounts}</td>
                        <td style={{ ...S.td, textAlign: "right", fontWeight: 700 }}>{fmt$(totals.revenue)}</td>
                        <td style={{ ...S.td, textAlign: "center", color: "#aaa" }}>{Math.round(totals.accounts / team.members.length)}</td>
                        <td style={{ ...S.td, textAlign: "center", color: "#aaa" }}>{Math.round(totals.accounts / (weeks.length || 1))}/wk</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>

              {Object.entries(TEAMS).map(([key, team]) => {
                const summary = repSummary(weeks).filter(r => team.members.includes(r.name));
                return (
                  <div key={key} style={{ ...S.section, border: `1px solid ${team.border}` }}>
                    <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 13, letterSpacing: 3, color: team.color, marginBottom: 10 }}>{team.label}</div>
                    <table style={S.table}>
                      <thead><tr>
                        <th style={{ ...S.th, textAlign: "center" }}>#</th>
                        <th style={S.th}>Rep</th>
                        <th style={{ ...S.th, textAlign: "center" }}>Total Accts</th>
                        <th style={{ ...S.th, textAlign: "right" }}>Revenue</th>
                        <th style={{ ...S.th, textAlign: "center" }}>Avg/Wk</th>
                        <th style={{ ...S.th, textAlign: "center" }}>Trend</th>
                      </tr></thead>
                      <tbody>{summary.map((rep, i) => (
                        <tr key={rep.name} style={S.tr}>
                          <td style={{ ...S.td, textAlign: "center", fontWeight: 700, color: i === 0 ? team.color : "#444" }}>{i === 0 ? "★" : i + 1}</td>
                          <td style={{ ...S.td, fontWeight: 600, cursor: "pointer", color: "#e0e0e0" }} onClick={() => setProfileRep(rep.name)}><RepName name={rep.name} /></td>
                          <td style={{ ...S.td, textAlign: "center" }}><span style={{ ...S.badge, background: team.bg, color: team.color }}>{rep.accounts}</span></td>
                          <td style={{ ...S.td, textAlign: "right", fontWeight: 700 }}>{fmt$(rep.revenue)}</td>
                          <td style={{ ...S.td, textAlign: "center", color: "#aaa" }}>{rep.avgPerWeek.toFixed(1)}</td>
                          <td style={{ ...S.td, textAlign: "center" }}><Spark data={repTrend(weeks, rep.name)} /></td>

                      ))}</tbody>
                    </table>
                  </div>

              })}
            </div>
          )}

          {/* ══ STAFF ══ */}
          {view === "staff" && (
            <div style={S.content}>
              <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 13, letterSpacing: 3, color: '#e05252', marginBottom: 14, opacity: 0.7 }}>🔒 STAFF VIEW · PRIVATE</div>

              {(() => {
                const officeAccounts = weeks.reduce((a, w) => a + weekTotals(w).accounts, 0);
                const officeRevenue = weeks.reduce((a, w) => a + weekTotals(w).revenue, 0);
                const officeAvg = officeAccounts / (weeks.length || 1);
                const officeProjected = Math.round(officeAccounts + officeAvg * weeksRemaining);
                const officeProjectedRev = Math.round(officeRevenue + officeAvg * (officeRevenue / (officeAccounts || 1)) * weeksRemaining);
                return (
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontSize: 9, letterSpacing: 3, color: '#555', fontWeight: 700, marginBottom: 8, textTransform: 'uppercase' }}>📈 Season Pacing · {Math.round(weeksRemaining)} wks left</div>
                    <div style={{ background: "linear-gradient(135deg,#0a1a10,#091208)", border: "1px solid #1e4a2e", borderRadius: 12, padding: "14px 16px", marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 9, letterSpacing: 2, color: '#3a6a4a', fontWeight: 700, marginBottom: 4, textTransform: 'uppercase' }}>🏢 Office Projected</div>
                        <div style={{ fontSize: 10, color: '#3a5a40' }}>{officeAccounts} now · {officeAvg.toFixed(1)}/wk avg</div>
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 40, color: "#3db557", lineHeight: 1 }}>{officeProjected}</div>
                        <div style={{ fontSize: 11, color: '#3a6a4a', fontWeight: 700 }}>{fmt$(officeProjectedRev)}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      {Object.entries(TEAMS).map(([key, team]) => {
                        const summary = repSummary(weeks).filter(r => team.members.includes(r.name));
                        const teamAccounts = summary.reduce((a, r) => a + r.accounts, 0);
                        const teamRevenue = summary.reduce((a, r) => a + r.revenue, 0);
                        const teamAvg = teamAccounts / (weeks.length || 1);
                        const teamProjected = Math.round(teamAccounts + teamAvg * weeksRemaining);
                        const teamProjectedRev = Math.round(teamRevenue + teamAvg * (teamRevenue / (teamAccounts || 1)) * weeksRemaining);
                        return (
                          <div key={key} style={{ flex: 1, background: team.bg, border: `1px solid ${team.border}`, borderRadius: 10, padding: "10px 10px" }}>
                            <div style={{ fontSize: 8, letterSpacing: 1.5, color: team.color, fontWeight: 700, marginBottom: 6, textTransform: 'uppercase', opacity: 0.8 }}>{team.label}</div>
                            <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 30, color: team.color, lineHeight: 1, marginBottom: 2 }}>{teamProjected}</div>
                            <div style={{ fontSize: 10, color: team.color, opacity: 0.6, fontWeight: 700 }}>{fmt$(teamProjectedRev)}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              <div style={{ ...S.section, border: '1px solid #3a1010' }}>

                  ? <div style={{ color: '#444', fontSize: 13, padding: '8px 0' }}>No reps flagged — everyone is above 6 in at least one of their last 2 weeks.</div>

                    <div key={s.name} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderTop: i > 0 ? '1px solid #2a1010' : 'none' }}>
                      <span style={{ fontWeight: 700, cursor: 'pointer', color: '#e07070', fontSize: 14 }} onClick={() => setProfileRep(s.name)}><RepName name={s.name} /></span>
                      <span style={{ fontSize: 11, color: '#664444' }}>{s.prev.label}: {s.prev.accounts} accts · {s.last.label}: {s.last.accounts} accts</span>
                    </div>
                  ))
                }
              </div>

              <div style={S.section}>
                <div style={S.sectionTitle}>📈 Season Pacing · End of August</div>
                <div style={{ fontSize: 10, color: '#555', marginBottom: 10 }}>{Math.round(weeksRemaining)} weeks remaining · projected by Aug 31</div>
                <div style={{ overflowX: "auto" }}>
                <table style={S.table}>
                  <thead><tr>
                    <th style={{ ...S.th, textAlign: "center" }}>#</th>
                    <th style={S.th}>Rep</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Current</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Avg/Wk</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Target</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Projected</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Gap</th>
                    <th style={{ ...S.th, textAlign: "right" }}>Proj. Rev</th>
                  </tr></thead>
                  <tbody>{[...allSummary].sort((a, b) => (b.accounts + b.avgPerWeek * weeksRemaining) - (a.accounts + a.avgPerWeek * weeksRemaining)).map((rep, i) => {
                    const target = ROOKIES.has(rep.name) ? 100 : 200;
                    const projected = Math.round(rep.accounts + rep.avgPerWeek * weeksRemaining);
                    const projRev = Math.round(rep.revenue + rep.avgPerWeek * weeksRemaining * rep.avgAcv);
                    const gap = projected - target;
                    const onPace = projected >= target;
                    const close = projected >= target * 0.85;
                    const projColor = onPace ? "#3db557" : close ? "#c8c820" : "#e05252";
                    return (
                      <tr key={rep.name} style={S.tr}>
                        <td style={{ ...S.td, textAlign: "center", color: "#444" }}>{i + 1}</td>
                        <td style={{ ...S.td, fontWeight: 600, cursor: 'pointer', color: '#e0e0e0', whiteSpace: "nowrap" }} onClick={() => setProfileRep(rep.name)}><RepName name={rep.name} /></td>
                        <td style={{ ...S.td, textAlign: "center", color: "#666" }}>{rep.accounts}</td>
                        <td style={{ ...S.td, textAlign: "center", color: "#666" }}>{rep.avgPerWeek.toFixed(1)}</td>
                        <td style={{ ...S.td, textAlign: "center", color: "#555", fontWeight: 700 }}>{target}</td>
                        <td style={{ ...S.td, textAlign: "center", fontWeight: 800, fontSize: 16, color: projColor }}>{projected}</td>
                        <td style={{ ...S.td, textAlign: "center", fontWeight: 700, color: onPace ? "#3db557" : "#e05252" }}>{gap > 0 ? `+${gap}` : gap}</td>
                        <td style={{ ...S.td, textAlign: "right", fontWeight: 700, whiteSpace: "nowrap", color: projRev >= 100000 ? "#f5c842" : "#3db557" }}>{fmt$(projRev)}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
                </div>
              </div>

              <div style={S.section}>
                <div style={S.sectionTitle}>All Rep Averages · Last 2 Weeks</div>
                <table style={S.table}>
                  <thead><tr>
                    <th style={S.th}>Rep</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Prev Wk</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Last Wk</th>
                    <th style={{ ...S.th, textAlign: "center" }}>Trend</th>
                  </tr></thead>
                  <tbody>{allSummary.map(rep => {
                    const hist = rep.weekHistory;
                    const last = hist[hist.length - 1];
                    const prev = hist.length >= 2 ? hist[hist.length - 2] : null;
                    const diff = prev ? last.accounts - prev.accounts : null;
                    const flagged = slumpNames.has(rep.name);
                    return (
                      <tr key={rep.name} style={S.tr}>
                        <td style={{ ...S.td, fontWeight: 600, cursor: 'pointer', color: flagged ? '#e07070' : '#e0e0e0' }} onClick={() => setProfileRep(rep.name)}>
                          <RepName name={rep.name} />{flagged && <span style={{ marginLeft: 5 }}>⚠️</span>}
                        </td>
                        <td style={{ ...S.td, textAlign: "center", color: "#666" }}>{prev ? prev.accounts : "—"}</td>
                        <td style={{ ...S.td, textAlign: "center", fontWeight: 700, color: flagged ? "#e05252" : "#e0e0e0" }}>{last ? last.accounts : "—"}</td>
                        <td style={{ ...S.td, textAlign: "center", fontWeight: 700, color: diff === null ? "#444" : diff > 0 ? "#3db557" : diff < 0 ? "#e05252" : "#888" }}>
                          {diff === null ? "—" : diff > 0 ? `+${diff} ▲` : `${diff} ▼`}
                        </td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>

              {quitSummary.length > 0 && (
                <div style={{ ...S.section, border: '1px solid #1a1a2a' }}>
                  <div style={{ fontFamily: "'Bebas Neue',cursive", fontSize: 13, letterSpacing: 3, color: '#555', marginBottom: 10 }}>☠️ QUIT</div>
                  <table style={S.table}>
                    <thead><tr>
                      <th style={S.th}>Rep</th>
                      <th style={{ ...S.th, textAlign: "center" }}>Total Accts</th>
                      <th style={{ ...S.th, textAlign: "right" }}>Total Rev</th>
                      <th style={{ ...S.th, textAlign: "center" }}>Wks Active</th>
                    </tr></thead>
                    <tbody>{quitSummary.map(rep => (
                      <tr key={rep.name} style={S.tr}>
                        <td style={{ ...S.td, color: '#555', fontWeight: 600 }}>{rep.name}</td>
                        <td style={{ ...S.td, textAlign: "center", color: '#444', fontWeight: 700 }}>{rep.accounts}</td>
                        <td style={{ ...S.td, textAlign: "right", color: '#444' }}>{fmt$(rep.revenue)}</td>
                        <td style={{ ...S.td, textAlign: "center", color: '#444' }}>{rep.weeksActive}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {showModal && <AddWeekModal weeks={weeks} onClose={() => setShowModal(false)} onSave={addWeek} />}
          {showGoal && <GoalModal goal={goal} onClose={() => setShowGoal(false)} onSave={setGoal} />}
          {pinQueue && <PinModal reason={pinQueue.reason} onSuccess={() => { setUnlocked(true); pinQueue.onSuccess(); }} onClose={() => setPinQueue(null)} />}
          {profileRep && (() => {
            const rep = allSummary.find(r => r.name === profileRep) || quitSummary.find(r => r.name === profileRep);
            return rep ? <RepProfileModal rep={rep} photo={photos[profileRep]} allWeeks={weeks} onClose={() => setProfileRep(null)} onPhotoUpdate={updatePhoto} /> : null;
          })()}
        </div>
      );
    }
